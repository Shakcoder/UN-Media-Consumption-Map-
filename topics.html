<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic Explorer — Global Media Consumption Atlas</title>
<style>
  :root {
    --un-blue: #009EDB;
    --un-blue-dark: #0072BC;
    --un-blue-ink: #003D6B;
    --accent-soft: #E6F4FB;
    --ink: #0F1A2B;
    --muted: #5C6B7E;
    --muted-2: #94A3B8;
    --bg: #F7FAFC;
    --surface: #FFFFFF;
    --border: #E3EBF1;
    --border-soft: #EEF3F7;
    --positive: #16A34A;
    --warn: #F59E0B;
    --danger: #DC2626;
    --shadow: 0 1px 2px rgba(15,26,43,0.04), 0 4px 14px rgba(15,26,43,0.06);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header.site { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  header.site .brand { display: flex; align-items: center; gap: 12px; }
  header.site .title { font-weight: 600; font-size: 15px; }
  header.site .subtitle { font-size: 12px; color: var(--muted); }
  header.site a.back { color: var(--un-blue-dark); text-decoration: none; font-size: 13px; }
  header.site a.back:hover { text-decoration: underline; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px;
            max-width: 1200px; margin: 16px auto; padding: 0 16px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: var(--radius); box-shadow: var(--shadow); }

  /* left: topic list */
  .list { padding: 10px; max-height: calc(100vh - 130px); overflow-y: auto; }
  .list input { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  .cat { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; color: var(--muted-2);
         text-transform: uppercase; margin: 12px 6px 4px; }
  .topic-row { display: flex; justify-content: space-between; align-items: center;
    padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .topic-row:hover { background: var(--accent-soft); }
  .topic-row.active { background: var(--accent-soft); font-weight: 600; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 600; }
  .badge.rising  { background: #E8F7EE; color: var(--positive); }
  .badge.falling { background: #FDEBEA; color: var(--danger); }
  .badge.steady  { background: var(--border-soft); color: var(--muted); }

  /* right: detail */
  .detail { padding: 20px; }
  .detail h1 { font-size: 22px; margin-bottom: 2px; }
  .detail .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .kpi { background: var(--bg); border: 1px solid var(--border-soft); border-radius: 8px;
         padding: 10px 14px; min-width: 130px; }
  .kpi .v { font-size: 20px; font-weight: 700; }
  .kpi .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  h3.sect { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: var(--muted-2);
            text-transform: uppercase; margin: 18px 0 8px; }
  svg.spark { width: 100%; height: 130px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-soft); }
  th { font-size: 11px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.5px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .up { color: var(--positive); } .down { color: var(--danger); }
  .note { font-size: 11px; color: var(--muted-2); margin-top: 14px; line-height: 1.5; }
  .movers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .movers .topic-row { border: 1px solid var(--border-soft); }
  .empty { color: var(--muted-2); font-size: 13px; padding: 8px; }
</style>
</head>
<body>

<header class="site">
  <div class="brand">
    <div>
      <div class="title">Topic Explorer</div>
      <div class="subtitle">Live topic intelligence · 167 UN-relevant topics · 22 languages</div>
    </div>
  </div>
  <div style="display:flex;gap:16px;"><a class="back" href="ask.html">Ask the Analyst</a><a class="back" href="index.html">← Back to the Atlas</a></div>
</header>

<div class="layout">
  <div class="card list" id="topic-list">
    <input id="search" type="search" placeholder="Search topics…">
    <div id="list-body"><div class="empty">Loading topics…</div></div>
  </div>

  <div class="card detail" id="detail">
    <div class="empty">Loading…</div>
  </div>
</div>

<script>
const LANG_NAMES = {en:"English", fr:"French", es:"Spanish", ar:"Arabic", pt:"Portuguese",
  ru:"Russian", zh:"Chinese", hi:"Hindi", bn:"Bengali", id:"Indonesian", sw:"Swahili",
  ha:"Hausa", am:"Amharic", ur:"Urdu", fa:"Persian", tr:"Turkish", vi:"Vietnamese",
  th:"Thai", ja:"Japanese", de:"German", uk:"Ukrainian", ko:"Korean"};
const CAT_LABELS = {climate:"Climate & environment", health:"Health",
  humanitarian:"Humanitarian & migration", peace:"Peace & security",
  rights:"Rights & governance", development:"Development & economy",
  education:"Education & children", technology:"Technology & digital",
  infrastructure:"Energy, food, water & urban", institutions:"UN & institutions"};

let DATA = null, activeQid = null;

function sparkline(series) {
  const w = 600, h = 130, pad = 4;
  const vals = series.filter(v => v != null);
  if (!vals.length) return "";
  const mx = Math.max(...vals), mn = Math.min(...vals);
  const range = (mx - mn) || 1;
  const pts = series.map((v, i) => {
    const x = pad + i * (w - 2 * pad) / (series.length - 1);
    const y = v == null ? null : h - pad - ((v - mn) / range) * (h - 2 * pad);
    return y == null ? null : `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--un-blue)" stroke-width="2"/>
  </svg>`;
}

function momentumBadge(m) {
  const sym = m === "rising" ? "▲ rising" : m === "falling" ? "▼ falling" : "— steady";
  return `<span class="badge ${m}">${sym}</span>`;
}

function renderList(filter) {
  const body = document.getElementById("list-body");
  const q = (filter || "").toLowerCase();
  const byCat = {};
  for (const [qid, t] of Object.entries(DATA.topics)) {
    if (q && !t.label_en.toLowerCase().includes(q)) continue;
    (byCat[t.category] = byCat[t.category] || []).push([qid, t]);
  }
  let html = "";
  for (const cat of Object.keys(CAT_LABELS)) {
    const rows = (byCat[cat] || []).sort((a, b) => b[1].global_velocity - a[1].global_velocity);
    if (!rows.length) continue;
    html += `<div class="cat">${CAT_LABELS[cat]}</div>`;
    for (const [qid, t] of rows) {
      html += `<div class="topic-row ${qid === activeQid ? "active" : ""}" data-qid="${qid}">
        <span>${t.label_en}</span>${momentumBadge(t.momentum)}</div>`;
    }
  }
  body.innerHTML = html || `<div class="empty">No topics match.</div>`;
  body.querySelectorAll(".topic-row").forEach(r =>
    r.addEventListener("click", () => { activeQid = r.dataset.qid; renderDetail(); renderList(document.getElementById("search").value); }));
}

function renderGlobalMovers() {
  const sorted = Object.entries(DATA.topics).sort((a, b) => b[1].global_velocity - a[1].global_velocity);
  const risers = sorted.slice(0, 5), fallers = sorted.slice(-5).reverse();
  const row = ([qid, t]) => {
    const pct = Math.round(t.global_velocity * 100);
    const cls = pct >= 0 ? "up" : "down";
    const sym = pct >= 0 ? "+" : "";
    return `<div class="topic-row" data-qid="${qid}"><span>${t.label_en}</span>
      <span class="${cls}">${sym}${pct}%</span></div>`;
  };
  return `<h1>Global topic movers</h1>
    <div class="sub">Across 167 UN-relevant topics in 22 languages · updated ${DATA.generated}</div>
    <h3 class="sect">Rising this week</h3><div class="movers">${risers.map(row).join("")}</div>
    <h3 class="sect">Falling this week</h3><div class="movers">${fallers.map(row).join("")}</div>
    <div class="note">Velocity = attention in the last 7 days vs. the prior 30 days, measured from
    Wikipedia reading patterns (Wikimedia Pageviews API — a measure of what people <em>look up</em>,
    not what media publish). Select any topic on the left for detail.</div>`;
}

function renderDetail() {
  const el = document.getElementById("detail");
  if (!activeQid) { el.innerHTML = renderGlobalMovers(); bindMoverClicks(el); return; }
  const t = DATA.topics[activeQid];
  const pct = Math.round(t.global_velocity * 100);
  const velCls = pct >= 0 ? "up" : "down";

  let langRows = "";
  for (const [lang, st] of Object.entries(t.demand_by_language || {})) {
    const v = Math.round(st.velocity * 100);
    langRows += `<tr><td>${LANG_NAMES[lang] || lang}</td>
      <td class="num">${Math.round(st.weekly_daily_avg_views).toLocaleString()}</td>
      <td class="num ${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${v}%</td></tr>`;
  }

  let mediaRows = "";
  for (const c of (t.top_covering_media_countries || []).slice(0, 8)) {
    mediaRows += `<tr><td>${c.iso3}</td><td class="num">${c.coverage_share_pct}%</td></tr>`;
  }

  el.innerHTML = `
    <h1>${t.label_en}</h1>
    <div class="sub">${CAT_LABELS[t.category] || t.category} · ${momentumBadge(t.momentum)}</div>
    <div class="kpis">
      <div class="kpi"><div class="v ${velCls}">${pct >= 0 ? "+" : ""}${pct}%</div><div class="l">global velocity (7d vs 30d)</div></div>
      ${t.news_articles_7d != null ? `<div class="kpi"><div class="v">${t.news_articles_7d.toLocaleString()}</div><div class="l">news articles, 7 days (GDELT)</div></div>` : ""}
    </div>
    <h3 class="sect">Global attention — last 120 days (Wikipedia views/day, all tracked languages)</h3>
    ${sparkline(t.global_series || [])}
    <h3 class="sect">Demand by language (what people look up)</h3>
    <table><tr><th>Language</th><th style="text-align:right">Views/day (7d avg)</th><th style="text-align:right">Velocity</th></tr>${langRows}</table>
    ${mediaRows ? `<h3 class="sect">Media coverage by outlet country (what media publish — GDELT, 14d)</h3>
    <table><tr><th>Country</th><th style="text-align:right">Share of coverage</th></tr>${mediaRows}</table>` : ""}
    <div class="note">Demand (Wikipedia lookups) and supply (news coverage) are deliberately separate
    signals — a gap between them can mean an under-served information need.
    Sources: Wikimedia Pageviews API (CC0), GDELT 2.0 DOC API. Updated ${DATA.generated}.</div>`;
}

function bindMoverClicks(scope) {
  scope.querySelectorAll(".topic-row[data-qid]").forEach(r =>
    r.addEventListener("click", () => { activeQid = r.dataset.qid; renderDetail(); renderList(document.getElementById("search").value); }));
}

document.getElementById("search").addEventListener("input", e => renderList(e.target.value));

(async function init() {
  try {
    const r = await fetch("data/trends/topic_intelligence.json", { cache: "no-cache" });
    DATA = await r.json();
    renderList("");
    renderDetail();
  } catch (err) {
    document.getElementById("detail").innerHTML =
      `<div class="empty">Trend data is not available yet — it is generated by the daily
       trend-engine workflow. (${err.message})</div>`;
  }
})();
</script>
</body>
</html>
