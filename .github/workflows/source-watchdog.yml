name: Source watchdog (monthly)

# The Atlas's annual flagship sources (RSF, Freedom House, Reuters DNR,
# GSMA, Afrobarometer, UN WPP) can't refresh themselves — a human integrates
# each new edition once a year. This workflow makes sure that moment is
# never missed: once a month it probes each source's site, and when a NEWER
# edition than the one integrated is detected it opens a GitHub Issue with
# step-by-step refresh instructions (written for non-coders).
#
# It never modifies data. It only watches and opens issues. It also opens one
# when it can no longer read a source's site at all, because a probe that has
# quietly stopped working looks exactly like "no new edition yet".
#
# De-duplication: an OPEN issue with the same title stops a repeat, so a
# reminder is never duplicated while it is still on the maintainer's plate.
# A CLOSED one does not — closing a reminder that is still true (the edition
# still isn't integrated, the source still can't be read) only postpones it to
# next month. That asymmetry is deliberate: publishers often announce an
# edition months before the data is downloadable, and the old "closed = gone
# forever" rule meant closing that premature reminder also threw away the one
# that should have fired when the data really landed. Two things end a
# reminder for good — integrating the edition (bump INTEGRATED in
# scripts/check_source_editions.py), or closing the issue with GitHub's
# built-in `wontfix` label, which this workflow honours forever. That label is
# used because it already exists in every repository: switching a reminder off
# must not require creating anything.

on:
  schedule:
    - cron: "0 6 3 * *"    # 3rd of every month, 06:00 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    # A normal run takes about a minute. The ceiling is high because the probe
    # retries each unreachable site three times before declaring it unreadable:
    # if every source were down at once that adds up to ~20 minutes, and the
    # run must finish and file its report rather than be killed halfway.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe sources for new editions
        run: python scripts/check_source_editions.py

      - name: Open issues for the findings (skip duplicates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          count=$(python3 -c "import json;print(len(json.load(open('watchdog_findings.json'))))")
          echo "Findings: $count"
          [ "$count" = "0" ] && exit 0
          # Titles are compared exactly (grep -Fx) against lists fetched once,
          # rather than through GitHub's fuzzy issue search: a search that
          # nearly-matches would skip a real reminder, which is the one mistake
          # this workflow must never make.
          gh issue list --state open --limit 300 --json title --jq '.[].title' > /tmp/open_titles.txt
          gh issue list --state closed --limit 300 --json title,labels \
            --jq '.[] | select(any(.labels[]; .name == "wontfix")) | .title' > /tmp/dismissed_titles.txt
          for i in $(seq 0 $((count - 1))); do
            title=$(python3 -c "import json;print(json.load(open('watchdog_findings.json'))[$i]['title'])")
            if grep -Fxq "$title" /tmp/open_titles.txt; then
              echo "Still open, not duplicating: $title"
              continue
            fi
            if grep -Fxq "$title" /tmp/dismissed_titles.txt; then
              echo "Dismissed by the maintainer, staying quiet: $title"
              continue
            fi
            python3 -c "import json;print(json.load(open('watchdog_findings.json'))[$i]['body'])" > /tmp/issue_body.md
            # Two different jobs for the maintainer, so two different labels:
            # "a new edition is out" is a data refresh, "I can no longer read
            # this source" is a maintenance alert.
            kind=$(python3 -c "import json;print(json.load(open('watchdog_findings.json'))[$i].get('kind','new_edition'))")
            label="data-refresh"
            if [ "$kind" = "cannot_check" ]; then label="automation"; fi
            # --label is best-effort: if the label has been deleted, gh exits
            # non-zero and no issue is created at all (that is how the
            # 2026-07-27 run lost its reminder). Retry unlabelled rather than
            # lose it.
            gh issue create --title "$title" --body-file /tmp/issue_body.md --label "$label" \
              || gh issue create --title "$title" --body-file /tmp/issue_body.md
            echo "Opened: $title"
          done

      - name: Open an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source watchdog failed on $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "in:title \"Source watchdog failed\"" --json number --jq 'length') || existing=""
          # If even the duplicate check fails, open the issue anyway: a repeated
          # alarm is a nuisance, a missing one is the problem this step exists for.
          if [ "${existing:-0}" = "0" ]; then
            cat > /tmp/watchdog_issue.md <<'BODY'
          The monthly source-watchdog workflow failed, so this month nothing checked whether RSF, Freedom House, Reuters DNR, GSMA, Afrobarometer, UN DESA or the ad-market forecasters have published a new annual edition.

          No data is affected — this workflow never changes data. But integrating those annual editions is the one recurring human job in the Atlas, and it only happens when this watchdog asks for it, so a run that keeps failing silently is how the site goes years out of date.

          Open the Actions tab, click the failed run, and see which step is red. Close this once a later run succeeds; you can also press "Run workflow" on the Source watchdog page to retry immediately.
          BODY
            # --label is best-effort — never let a missing label swallow the alarm.
            gh issue create --title "$title" --body-file /tmp/watchdog_issue.md --label "automation" \
              || gh issue create --title "$title" --body-file /tmp/watchdog_issue.md
          else
            echo "An open failure issue already exists — not duplicating."
          fi
