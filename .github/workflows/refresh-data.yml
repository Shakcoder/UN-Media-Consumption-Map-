name: Refresh country data

# Runs the refresh script on a schedule and commits any changes back to the
# repository. GitHub Pages automatically rebuilds the site on commit, so this
# is the entire "automated weekly update" pipeline.
#
# The schedule below runs every Monday at 03:00 UTC (off-peak for World Bank
# and most of Europe/Americas). Change the cron string below to adjust cadence.
# Cron format: minute hour day-of-month month day-of-week
# Cheat-sheet: https://crontab.guru/

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch:       # allows a manual "Run workflow" button in GitHub
  push:
    paths:
      - "data/static_countries.json"   # re-run immediately when the human-curated file changes
      - "scripts/refresh_data.py"
      - ".github/workflows/refresh-data.yml"

# This workflow writes back to the repo, so it needs contents:write
# (and issues:write for the failure-alert step).
permissions:
  contents: write
  issues: write

# Never let two refreshes race each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

# Future-proof against GitHub's Node 20 → Node 24 migration (required by June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 45 min: the refresh itself takes ~2-4 min, but the World Bank API has
    # slow spells (a 20-min ceiling cancelled run #42 on 2026-07-21). Headroom
    # costs nothing — the job exits as soon as it's done.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run refresh script
        run: |
          python scripts/refresh_data.py

      - name: Fetch Statcounter platform web shares (non-fatal)
        # Monthly data; running weekly just keeps the 3-month window fresh.
        # A Statcounter outage must never block the main country refresh,
        # hence the || true — the previous JSON simply stays in place.
        run: |
          python scripts/fetch_statcounter.py || echo "::warning::Statcounter fetch failed — keeping previous platform_web_shares.json"

      - name: Post-run diagnostic
        run: |
          echo ""
          echo "=================================================="
          echo "=== After-script diagnostic: contents of data/ ==="
          echo "=================================================="
          ls -la data/
          if [ -f data/countries.json ]; then
            echo ""
            echo "countries.json was produced, size $(wc -c < data/countries.json) bytes."
            echo "First 300 characters:"
            head -c 300 data/countries.json
            echo ""
          else
            echo "::error::countries.json was NOT produced by the script"
            exit 1
          fi

      # THE PUBLICATION GATE (added 2026-07-26). Before this existed, whatever
      # refresh_data.py produced was committed and published straight to the
      # live site — the fabrication guard, range checks and citation checks in
      # validate_atlas.py only ran if someone remembered to run them by hand.
      # An upstream API returning garbage would therefore have auto-published.
      # Now a validation failure stops the commit: the site keeps serving the
      # last known-good data and the failure-alert step opens an issue.
      - name: Validate refreshed data (blocks publication on error)
        run: python scripts/validate_atlas.py

      - name: Commit updated data (if changed)
        run: |
          set -e
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          # ORDER MATTERS: commit first (rebase refuses a dirty tree), THEN
          # pull --rebase to replay on top of any concurrent trend-engine
          # commit, then push.
          git add data/countries.json
          git add data/platform_web_shares.json 2>/dev/null || true
          echo "=== git status ==="
          git status
          echo "=== git diff --cached summary ==="
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes — data is already up to date."
          else
            git commit -m "chore(data): refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "=== Pushed. ==="
          fi

      - name: Open an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly data refresh failed on $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "in:title \"Weekly data refresh failed\"" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            # --label is best-effort: if the label has been deleted, gh exits
            # non-zero and the alert itself is lost (this happened to the
            # source watchdog). Retry unlabelled rather than lose the alarm.
            gh issue create --title "$title" \
              --body "The weekly refresh-data workflow failed. Open the Actions tab, click the failed run, and check which step went red. The site keeps serving the last good data meanwhile. Close this once a later run succeeds." \
              --label "automation" \
            || gh issue create --title "$title" \
              --body "The weekly refresh-data workflow failed. Open the Actions tab, click the failed run, and check which step went red. The site keeps serving the last good data meanwhile. Close this once a later run succeeds."
          else
            echo "An open failure issue already exists — not duplicating."
          fi
