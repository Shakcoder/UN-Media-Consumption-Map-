name: Trend engine (daily)

# The daily heartbeat of the Content Intelligence Platform.
# 1. Fetches each country's trending Google searches (Google Trends RSS —
#    a snapshot feed with no history upstream, so a missed day is gone)
# 2. Fetches GDELT global news coverage for 183 UN topics (supply signal)
# 3. Fetches each country's most-read Wikipedia pages (per-country demand,
#    Wikimedia top-per-country — directly measured, no language weighting)
# 4. Fetches Wikipedia pageviews for the same topics x 22 languages (demand)
# 5. Computes per-topic and per-country intelligence (velocity, trending)
# 6. Commits the results — GitHub Pages republishes automatically.
#
# PARALLEL LANES (2026-08-10). One job used to do all of this in sequence,
# and every fetch step hit its timeout every single day: Wikimedia and GDELT
# rate-limit PER IP, and one runner's IP simply has a smaller budget than a
# day's work needs (observed steady state: ~1,150 of ~3,100 pageview series
# stale, the per-country fetch dying at ~100 of 195). Now the work runs in
# parallel lanes, each on its own runner — its own IP, its own rate budget:
#
#   supply lane   — Google Trends, then GDELT, then per-country reading
#                   lists (three different hosts sharing one runner)
#   demand lanes  — Wikipedia pageviews split into 3 shards, taken
#                   round-robin from the stalest-first work list
#   assemble      — merges the shard outputs, computes the intelligence,
#                   makes the single daily commit, and polices freshness
#
# Every fetcher still checkpoints to disk and seeds from the previous
# snapshot, so a killed lane costs freshness only, never data — the shard
# artifacts upload whatever the checkpoints saved (if: always()).
#
# STALENESS ALERT (added 2026-07-26): "degrades gracefully" was hiding a
# real failure. The Wikipedia step had been hitting its timeout every day
# for three weeks; continue-on-error meant the run still reported SUCCESS,
# and two-thirds of series stayed frozen while the published file said it
# was updated daily. Two protections remain in force:
#   * every fetcher works stalest-series-first, so a truncated run
#     refreshes exactly what the previous one missed (self-healing);
#   * the assemble job fails the run when most series are stale or a
#     per-country file's newest data ages past 4 days, so the
#     failure-alert issue actually fires instead of a green tick.
#
# Runs at 16:05 UTC daily. MOVED from 05:30 (2026-08-11): Wikimedia's
# per-article data for "yesterday" is NOT yet published at 05:30 — the
# 2026-08-11 05:30 run stored series ending Aug 9 and missed the Colombia
# earthquake spike that a 15:00 UTC rerun then captured. The per-article
# dumps land late morning UTC; 16:05 is reliably after them, so every run
# gets a complete yesterday. (The intraday Google-Trends/Bluesky snapshots
# have their own lightweight workflow, trends-pulse.yml, so breaking search
# trends no longer depend on this single daily moment.)

on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write
  issues: write      # failure-alert step opens an issue

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: trend-engine
  cancel-in-progress: false

jobs:
  supply:
    # Google Trends runs FIRST (snapshot feed — a missed day is
    # unrecoverable), then GDELT, then the per-country reading lists.
    # Three different hosts, so they share this runner amicably.
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch per-country trending searches (Google Trends RSS)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/fetch_trends_google.py

      - name: Fetch Bluesky trending topics (global open-social pulse)
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/fetch_trends_bluesky.py

      - name: Fetch GDELT news coverage (supply signal)
        timeout-minutes: 50
        continue-on-error: true
        run: python scripts/fetch_trends_gdelt.py

      - name: Fetch per-country most-read Wikipedia pages
        timeout-minutes: 25
        continue-on-error: true
        run: python scripts/fetch_trends_wiki_countries.py

      # Whatever the steps above managed to save (checkpoints included)
      # travels to the assemble job. Missing files are only a warning: the
      # repo's previous copies then stand for another day.
      - name: Upload supply outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-outputs
          path: |
            data/trends/country_searches.json
            data/trends/bluesky_trends.json
            data/trends/gdelt_coverage.json
            data/trends/country_reading.json
          if-no-files-found: warn

  press:
    # Media Cloud national-press UN shares — its own small lane: it spends a
    # per-KEY quota (not an IP budget), needs the repo secret, and finishes
    # in minutes, so it must never queue behind the Wikimedia steps.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch national-press UN-coverage shares (Media Cloud)
        timeout-minutes: 15
        continue-on-error: true
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: python scripts/fetch_press_un_coverage.py

      # OONI is keyless and finishes in ~5 minutes; it shares this lane
      # because both are per-country evidence layers with per-service (not
      # per-IP-starved) budgets. CC BY-NC-SA data — non-profit use only.
      - name: Fetch measured news-site censorship (OONI)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/fetch_ooni_censorship.py

      - name: Upload press output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-output
          path: |
            data/trends/press_un_coverage.json
            data/trends/ooni_censorship.json
          if-no-files-found: warn

  demand:
    # Wikipedia pageviews, split across 3 runners. Wikimedia's per-IP budget
    # was the binding constraint — three runners mean three budgets. Each
    # shard is a round-robin slice of the stalest-first work list, so each
    # is itself stalest-first and self-healing.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false          # one throttled shard must not cancel the rest
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Wikipedia pageviews (shard ${{ matrix.shard }} of 3)
        timeout-minutes: 45
        continue-on-error: true
        run: >
          python scripts/fetch_trends_wikipedia.py
          --shard ${{ matrix.shard }} 3
          --out data/trends/wiki_shard_${{ matrix.shard }}.json

      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-shard-${{ matrix.shard }}
          path: data/trends/wiki_shard_${{ matrix.shard }}.json
          if-no-files-found: warn

  assemble:
    # Runs whatever happened above (if: always()): partial lanes still
    # publish what they saved, and the freshness police below decides
    # whether the day counts as healthy.
    needs: [supply, demand, press]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download supply outputs
        continue-on-error: true      # missing artifact = repo copies stand
        uses: actions/download-artifact@v4
        with:
          name: supply-outputs
          path: data/trends/

      - name: Download press output
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: press-output
          path: data/trends/

      - name: Download pageview shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: wiki-shard-*
          merge-multiple: true
          path: data/trends/

      - name: Merge pageview shards
        run: |
          python scripts/fetch_trends_wikipedia.py --merge \
            data/trends/wiki_shard_1.json \
            data/trends/wiki_shard_2.json \
            data/trends/wiki_shard_3.json
          # shard files are working files, never published
          rm -f data/trends/wiki_shard_*.json

      - name: Extend the long-term attention archive
        # Re-derives the archive's live-window section from the merged
        # snapshot and appends the new day (no network — see
        # scripts/update_attention_archive.py). continue-on-error because a
        # failure here must never block the day's main publish; the
        # freshness police below turns a silent failure into a red run.
        continue-on-error: true
        run: python scripts/update_attention_archive.py

      - name: Compute topic intelligence
        run: python scripts/compute_topic_intelligence.py

      - name: Commit updated trend data (if changed)
        id: commit
        run: |
          set -e
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          # ORDER MATTERS: commit first (rebase refuses to run on a dirty tree),
          # THEN pull --rebase to replay our commit on top of any concurrent
          # commit (e.g. the weekly refresh), then push.
          # explicit paths: never publish stray files that land in data/trends/
          git add data/trends/wiki_pageviews.json data/trends/gdelt_coverage.json data/trends/topic_intelligence.json
          # Guarded separately: under set -e, one missing pathspec would kill
          # the WHOLE day's commit (git add exits 128 on a missing file).
          if [ -f data/trends/country_reading.json ]; then
            git add data/trends/country_reading.json
          fi
          if [ -f data/trends/country_searches.json ]; then
            git add data/trends/country_searches.json
          fi
          if [ -f data/trends/bluesky_trends.json ]; then
            git add data/trends/bluesky_trends.json
          fi
          if [ -f data/trends/press_un_coverage.json ]; then
            git add data/trends/press_un_coverage.json
          fi
          if [ -f data/trends/ooni_censorship.json ]; then
            git add data/trends/ooni_censorship.json
          fi
          if [ -f data/trends/attention_archive.json ]; then
            git add data/trends/attention_archive.json
          fi
          if git diff --cached --quiet; then
            echo "No changes — trend data already up to date."
          else
            git commit -m "chore(trends): daily update $(date -u +%Y-%m-%d)"
            # A run checks out the commit it was DISPATCHED on, so anything
            # pushed to main during the ~90 fetch minutes must be absorbed by
            # this rebase. Different files (e.g. the weekly refresh) merge
            # cleanly; a conflict can only be another trend commit — normally
            # impossible (the concurrency group serialises runs), but a
            # cancelled run's always()-commit slipped one in on 2026-08-10.
            # On conflict OUR side wins: every assembled file was seeded from
            # the previous snapshot and only gains freshness. (During a
            # rebase, the commit being replayed — ours — is "--theirs".)
            if ! git pull --rebase origin main; then
              git checkout --theirs -- data/trends/*.json || true
              git add data/trends/
              GIT_EDITOR=true git rebase --continue
            fi
            git push
            echo "Pushed."
          fi

      # The data is committed by now, so the site always has the freshest
      # available figures — but if most of the tracked universe is stale the
      # run must NOT report success, or nobody learns the fetch is starving.
      - name: Fail if most trend series are stale
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("data/trends/topic_intelligence.json")
          if not p.exists():
              print("::warning::topic_intelligence.json missing — nothing to check")
              sys.exit(0)
          cov = json.loads(p.read_text()).get("coverage", {})
          cur, stale = cov.get("series_current", 0), cov.get("series_stale_excluded", 0)
          # The alarm watches SCOREABLE staleness only (added 2026-08-11):
          # ~65% of series are a dormant low-traffic tail refreshed on
          # Sundays by design, which used to trip a 1,100-series warning on
          # every single run — a false alarm that teaches people to ignore
          # the real one. Older files lack the key; fall back to the total
          # so the guard can never silently vanish.
          scoreable_stale = cov.get("series_stale_scoreable", stale)
          total = cur + stale
          print(f"Series current: {cur} / {total} "
                f"(stale-and-scoreable: {scoreable_stale}); "
                f"topics scored: {cov.get('topics_scored')}")
          rc = 0
          if cur and scoreable_stale > cur * 0.25:
              print(f"::error::{scoreable_stale} scoreable demand series are stale (>25% of "
                    f"the {cur} current ones). The Wikipedia fetch is losing real signal — "
                    f"check the demand-shard logs; raise the shard count if it persists.")
              rc = 1
          elif cur and scoreable_stale > cur * 0.10:
              print(f"::warning::{scoreable_stale} scoreable demand series are stale — "
                    f"watch this; if it keeps climbing the fetch needs more shards.")

          # Long-term attention archive: rewritten in lockstep with the live
          # file by update_attention_archive.py (its step is continue-on-error,
          # so its exit code is swallowed too). If it stops keeping up, the
          # Topic Explorer's pre-120-day windows quietly freeze — police it.
          ar_p = Path("data/trends/attention_archive.json")
          wk_p = Path("data/trends/wiki_pageviews.json")
          if wk_p.exists():
              w_upd = json.loads(wk_p.read_text()).get("updated")
              if not ar_p.exists():
                  # A warning, not an error: before the one-time backfill
                  # workflow has ever run (or if the file is deliberately
                  # retired) there is nothing to keep fresh. validate_atlas
                  # warns on this too, so an accidental deletion still shows.
                  print("::warning::attention_archive.json not present — the Topic "
                        "Explorer's pre-120-day windows are dark; run the "
                        "attention-archive-backfill workflow to (re)create it.")
              else:
                  a_end = (json.loads(ar_p.read_text()).get("_meta") or {}).get("end")
                  print(f"Attention archive: ends {a_end} (live file: {w_upd})")
                  if a_end != w_upd:
                      print(f"::error::attention_archive.json ends {a_end} but the live file "
                            f"is at {w_upd} — the archive append is failing; check the "
                            f"'Extend the long-term attention archive' step logs.")
                      rc = 1

          # Same idea for the per-country reading lists: their fetch step's
          # exit code is swallowed by continue-on-error, so freshness has to
          # be policed here or a permanent AQS breakage stays green forever.
          from datetime import date, datetime
          cr_p = Path("data/trends/country_reading.json")
          if cr_p.exists():
              crc = json.loads(cr_p.read_text()).get("countries", {})
              dates = [r.get("date") for r in crc.values()
                       if not r.get("withheld") and r.get("date")]
              if dates:
                  newest = max(dates)
                  age = (date.today() - datetime.strptime(newest, "%Y-%m-%d").date()).days
                  print(f"Country reading lists: newest data {newest} ({age} days old)")
                  if age > 4:
                      print(f"::error::country_reading.json's newest data is {age} days old — "
                            f"the per-country fetch has been failing silently; check the "
                            f"'Fetch per-country most-read Wikipedia pages' step logs.")
                      rc = 1
                  elif age > 2:
                      print(f"::warning::country_reading.json is {age} days old — watch this.")

          # And the trending-searches snapshot. Its feed keeps no history
          # upstream, so a silent failure is permanent data loss — that earns
          # it the same policing as the reading lists.
          csn_p = Path("data/trends/country_searches.json")
          if csn_p.exists():
              csc = json.loads(csn_p.read_text()).get("countries", {})
              dates = [r.get("date") for r in csc.values()
                       if not r.get("unsupported") and r.get("date")]
              if dates:
                  newest = max(dates)
                  age = (date.today() - datetime.strptime(newest, "%Y-%m-%d").date()).days
                  print(f"Trending searches: newest data {newest} ({age} days old)")
                  if age > 4:
                      print(f"::error::country_searches.json's newest data is {age} days old — "
                            f"the Google Trends fetch has been failing silently, and every "
                            f"missed day is unrecoverable; check the "
                            f"'Fetch per-country trending searches' step logs.")
                      rc = 1
                  elif age > 2:
                      print(f"::warning::country_searches.json is {age} days old — watch this.")

          # PER-COUNTRY staleness distribution (2026-08-11): the newest-date
          # checks above can stay green while individual countries freeze —
          # one fresh country holds max(dates) current forever. Count the
          # frozen ones instead.
          def stale_country_count(path, date_key, skip_key):
              p = Path(path)
              if not p.exists():
                  return None
              recs = json.loads(p.read_text()).get("countries", {})
              n = 0
              for r in recs.values():
                  if r.get(skip_key):
                      continue
                  d = r.get(date_key)
                  if not d:
                      continue
                  try:
                      age = (date.today() - datetime.strptime(d, "%Y-%m-%d").date()).days
                  except ValueError:
                      continue
                  if age > 5:
                      n += 1
              return n
          for path, dk, sk, label in (
              ("data/trends/country_reading.json", "date", "withheld", "reading lists"),
              ("data/trends/country_searches.json", "date", "unsupported", "trending searches"),
          ):
              n = stale_country_count(path, dk, sk)
              if n is None:
                  continue
              print(f"{label}: {n} countries individually older than 5 days")
              if n > 40:
                  print(f"::error::{n} countries' {label} are each >5 days old — "
                        f"the per-country fetch is starving broadly even though the "
                        f"file's newest date looks current; check the fetch logs.")
                  rc = 1
              elif n > 10:
                  print(f"::warning::{n} countries' {label} are each >5 days old — "
                        f"watch this; the stalest-first ordering should clear it in "
                        f"a few runs if the budget allows.")

          # National-press UN shares: rolling weekly measure refreshed daily,
          # stalest-first — the newest per-country retrieval date is the
          # health signal (the fetcher exits 0 even on a partial day).
          pu_p = Path("data/trends/press_un_coverage.json")
          if pu_p.exists():
              puc = json.loads(pu_p.read_text()).get("countries", {})
              rdates = [r.get("retrieved") for r in puc.values() if r.get("retrieved")]
              if rdates:
                  newest = max(rdates)
                  age = (date.today() - datetime.strptime(newest, "%Y-%m-%d").date()).days
                  print(f"National-press UN shares: newest retrieval {newest} ({age} days old)")
                  if age > 7:
                      print(f"::error::press_un_coverage.json's newest retrieval is {age} days "
                            f"old — the Media Cloud fetch has been failing silently (key "
                            f"expired? quota? endpoint change?); check the "
                            f"'Fetch national-press UN-coverage shares' step logs.")
                      rc = 1
                  elif age > 3:
                      print(f"::warning::press_un_coverage.json is {age} days old — watch this.")

          # OONI censorship layer: rolling window refreshed daily; the newest
          # per-country retrieval date is the health signal.
          oo_p = Path("data/trends/ooni_censorship.json")
          if oo_p.exists():
              ooc = json.loads(oo_p.read_text()).get("countries", {})
              rdates = [r.get("retrieved") for r in ooc.values() if r.get("retrieved")]
              if rdates:
                  newest = max(rdates)
                  age = (date.today() - datetime.strptime(newest, "%Y-%m-%d").date()).days
                  print(f"OONI censorship: newest retrieval {newest} ({age} days old)")
                  if age > 7:
                      print(f"::error::ooni_censorship.json's newest retrieval is {age} days "
                            f"old — the OONI fetch has been failing silently; check the "
                            f"'Fetch measured news-site censorship' step logs.")
                      rc = 1
                  elif age > 3:
                      print(f"::warning::ooni_censorship.json is {age} days old — watch this.")

          # Bluesky pulse: same snapshot-with-no-upstream-history logic.
          bt_p = Path("data/trends/bluesky_trends.json")
          if bt_p.exists():
              bdate = json.loads(bt_p.read_text()).get("date")
              if bdate:
                  age = (date.today() - datetime.strptime(bdate, "%Y-%m-%d").date()).days
                  print(f"Bluesky pulse: data date {bdate} ({age} days old)")
                  if age > 4:
                      print(f"::error::bluesky_trends.json is {age} days old — the Bluesky "
                            f"fetch has been failing silently (its endpoint is 'unspecced' "
                            f"and may have changed shape); check the "
                            f"'Fetch Bluesky trending topics' step logs.")
                      rc = 1
                  elif age > 2:
                      print(f"::warning::bluesky_trends.json is {age} days old — watch this.")
          sys.exit(rc)
          PY

      - name: Open an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Trend engine failed on $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "in:title \"Trend engine failed\"" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            cat > /tmp/trend_issue.md <<'BODY'
          The daily trend-engine workflow failed. Open the Actions tab, click the failed run, and check which job and step went red.

          If the red step is **Fail if most trend series are stale** (in the assemble job), the data is still published, but a fetch lane is not keeping up: check which file the error names. The fetchers work stalest-first, so a few consecutive successful runs normally clear it. If it persists beyond a week, see docs/AUTOMATION.md, section "trend engine falls behind".

          A single bad day is usually harmless (the next run catches up) — this issue exists so repeated failures never go unnoticed. Close it once a later run succeeds.
          BODY
            sed -i 's/^          //' /tmp/trend_issue.md
            # --label is best-effort — never let a missing label swallow the alert.
            gh issue create --title "$title" --body-file /tmp/trend_issue.md --label "automation" \
              || gh issue create --title "$title" --body-file /tmp/trend_issue.md
          else
            echo "An open failure issue already exists — not duplicating."
          fi
