name: Trend engine (daily)

# The daily heartbeat of the Content Intelligence Platform.
# 1. Fetches GDELT global news coverage for 167 UN topics (supply signal)
# 2. Fetches Wikipedia pageviews for the same topics x 22 languages (demand)
# 3. Computes per-topic and per-country intelligence (velocity, trending)
# 4. Commits the results — GitHub Pages republishes automatically.
#
# RESILIENCE NOTES (learned from run #1):
# - Wikimedia rate-limits anonymous cloud IPs to ~hundreds of requests/hour.
#   The fetcher prunes dormant series (weekdays fetch ~1,100 calls, Sundays
#   refresh all ~3,100), adapts its pace to 429s, and checkpoints progress
#   every 250 series.
# - Compute + commit run even if a fetch step fails or times out
#   (if: always()), so partial progress is committed and the next daily
#   run continues incrementally. A bad day degrades gracefully; it never
#   breaks the site or loses data.
#
# Runs at 05:30 UTC daily (after Wikimedia finalizes yesterday's pageviews).

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write
  issues: write      # failure-alert step opens an issue

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: trend-engine
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GDELT news coverage (supply signal)
        timeout-minutes: 50
        continue-on-error: true
        run: python scripts/fetch_trends_gdelt.py

      - name: Fetch Wikipedia pageviews (demand signal)
        timeout-minutes: 85
        continue-on-error: true
        run: python scripts/fetch_trends_wikipedia.py

      - name: Compute topic intelligence
        if: always()
        run: python scripts/compute_topic_intelligence.py

      - name: Commit updated trend data (if changed)
        if: always()
        run: |
          set -e
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          # ORDER MATTERS: commit first (rebase refuses to run on a dirty tree),
          # THEN pull --rebase to replay our commit on top of any concurrent
          # commit (e.g. the weekly refresh), then push.
          # explicit paths: never publish stray files that land in data/trends/
          git add data/trends/wiki_pageviews.json data/trends/gdelt_coverage.json data/trends/topic_intelligence.json
          if git diff --cached --quiet; then
            echo "No changes — trend data already up to date."
          else
            git commit -m "chore(trends): daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "Pushed."
          fi

      - name: Open an issue if this run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Trend engine failed on $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --state open --search "in:title \"Trend engine failed\"" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" \
              --body "The daily trend-engine workflow failed. Open the Actions tab, click the failed run, and check which step went red. A single bad day is usually harmless (the next run catches up) — this issue exists so repeated failures never go unnoticed. Close it once a later run succeeds." \
              --label "automation"
          else
            echo "An open failure issue already exists — not duplicating."
          fi
